<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Spin a globe made only from the photographs NASA's EPIC camera took of Earth on any day since 2015, from 1.5 million km away, with that week's wildfires, storms and floods marked on it."

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://earth-from-a-million-miles.pages.dev/" />

    <meta property="og:image:alt" content="The whole sunlit Earth, photographed from 1.5 million km away." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta property="og:title" content="Earth, From a Million Miles" />
    <meta
      property="og:description"
      content="A globe you can spin, built from one day's real photographs of the whole Earth."
    />
    <!-- The photographs and events come straight from NASA; open those connections early. -->
    <link rel="preconnect" href="https://epic.gsfc.nasa.gov" crossorigin />
    <link rel="preconnect" href="https://eonet.gsfc.nasa.gov" crossorigin />
    <link rel="preconnect" href="https://www.gdacs.org" crossorigin />
    <link rel="preconnect" href="https://epic.gsfc.nasa.gov" />
    <!-- The one typeface, asked for before the stylesheet names it, so the title is not set twice. -->
    <link rel="preload" as="font" type="font/woff2" href="/node_modules/@fontsource-variable/geist/files/geist-latin-wght-normal.woff2" crossorigin />
    <title>Earth, From a Million Miles</title>

    </noscript>
    <script type="module" src="/src/main.tsx"></script>
